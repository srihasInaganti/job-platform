name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Package zip Lambdas for validation
        run: |
          chmod +x scripts/package_lambdas.sh
          ./scripts/package_lambdas.sh

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Tests
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
            pytest
          fi

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for AWS OIDC authentication
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build and push worker image
        run: |
          SHA=${{ github.sha }}
          REGISTRY="${{ secrets.ECR_REGISTRY }}"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"
          docker build --platform linux/amd64 -t "$REGISTRY/job-worker:$SHA" lambdas/worker
          docker push "$REGISTRY/job-worker:$SHA"

      - name: Package zip Lambdas
        run: |
          chmod +x scripts/package_lambdas.sh
          ./scripts/package_lambdas.sh

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform init
          terraform apply -auto-approve -var="worker_image_tag=${{ github.sha }}"